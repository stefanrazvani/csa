<template name="studyLibrary">
  <div class="study-page">
    <header class="study-hero">
      <div><span class="study-kicker">Camera cărților</span><h1>Bibliotecă și studiu</h1><p>Cunoașterea se așază în straturi, iar fiecare idee poate deveni începutul unui dialog.</p></div>
      <a class="btn btn-outline-light" href="{{conceptsPath}}">Harta conceptelor</a>
    </header>
    {{#if error}}<div class="alert alert-danger">{{error}}</div>{{/if}}
    <section class="study-toolbar">
      <label class="visually-hidden" for="studySearch">Caută în conținutul textelor</label>
      <input id="studySearch" class="form-control" placeholder="Caută în texte…">
      <button class="btn btn-primary js-study-search">Caută</button>
    </section>
    {{#if searchResults.length}}
      <section class="study-panel"><h2>Fragmente găsite</h2>{{#each searchResults}}<article class="study-search-hit"><span class="study-node-type">{{type}}</span><p>{{text}}</p>{{> csaObjectActions kind="message" id=_id}}</article>{{/each}}</section>
    {{/if}}
    {{#if canManage}}
      <div class="my-3">{{> csaObjectAdd kind="work" label="Adaugă lucrare"}}</div>
    {{/if}}
    {{> csaSimpleTable list=worksList action=workAction objectKind="work"}}
  </div>
</template>

<template name="studyReader">
  <div class="study-reader-page">
    {{#if work}}
      <header class="study-reader-header"><a href="{{libraryPath}}" class="study-back">← Bibliotecă</a><span class="study-kicker">Grad {{work.minGrade}}</span><h1>{{work.title}}</h1>{{> csaObjectActions kind="work" id=work._id}}<p>{{work.author}} {{work.edition}}</p>
        {{#if canManage}}{{#if reviewVersion}}<button class="btn btn-sm btn-warning js-publish-work">Publică versiunea în verificare</button>{{/if}}{{/if}}
      </header>
      <div class="study-reader-layout">
        <main class="study-text">
          {{#each readableNodes}}
            <article class="study-text-node study-{{type}}" data-id="{{_id}}">
              {{#if isHeading type}}<h2>{{text}}</h2>{{else}}<p>{{text}}</p><button class="study-discuss js-start-debate" type="button" data-id="{{_id}}" data-type="{{type}}" data-text="{{text}}">Deschide dezbatere</button>{{/if}}
            </article>
          {{else}}<div class="study-empty">Versiunea publicată nu conține încă text.</div>{{/each}}
        </main>
        <aside class="study-side">{{> csaListPager list=debatesList}}{{> csaListTools list=debatesList}}<h2>Dezbateri</h2>{{#each debates}}<a href="{{debatePath _id}}"><strong>{{title}}</strong><small>Grad {{minGrade}}</small></a>{{else}}<p class="text-muted">Nu există dezbateri.</p>{{/each}}</aside>
      </div>
    {{else}}<div class="study-loading">Se deschide lucrarea…</div>{{/if}}
  </div>
</template>

<template name="studyDebate">
  <div class="study-debate-page">
    {{#if debate}}
      <header><a href="{{libraryPath}}" class="study-back">← Bibliotecă</a><span class="study-kicker">Dezbatere · grad {{debate.minGrade}}</span><h1>{{debate.title}}</h1>{{> csaObjectActions kind="debate" id=debate._id}}{{#if debate.quoteSnapshot}}<blockquote>{{debate.quoteSnapshot}}</blockquote>{{/if}}</header>
      <section class="study-messages" aria-live="polite">{{> csaListPager list=messagesList}}{{> csaListTools list=messagesList}}{{#each messages}}<article><div class="study-message-meta">{{authorLabel createdBy}} · {{formatDate createdAt}}</div>{{#if quote}}<blockquote>{{quote}}</blockquote>{{/if}}<p>{{text}}</p>{{> csaObjectActions kind="message" id=_id}}</article>{{else}}<p class="text-muted">Deschide dialogul prin primul mesaj.</p>{{/each}}</section>
      {{> csaObjectAdd kind="message" label="Adaugă mesaj" parentField="debateId" parentId=debate._id}}
    {{else}}<div class="study-loading">Se încarcă dezbaterea…</div>{{/if}}
  </div>
</template>

<template name="studyConcepts">
  <div class="study-page"><header class="study-hero"><div><span class="study-kicker">Planșa ideilor</span><h1>Harta conceptelor</h1><p>Relații create și validate de oameni, legate de sursele lor.</p></div><a class="btn btn-outline-light" href="{{libraryPath}}">Bibliotecă</a></header>
    {{#if canManage}}<section class="study-panel">{{> csaObjectAdd kind="concept" label="Adaugă concept"}}<hr>{{> csaObjectAdd kind="relation" label="Adaugă relație"}}</section>{{/if}}
    <section class="study-panel"><div id="studyConceptGraph" class="study-concept-graph" role="img" aria-label="Graf interactiv al conceptelor"></div></section>
    {{> csaSimpleTable list=conceptsList objectKind="concept"}}
    <section class="study-panel">{{> csaListPager list=relationsList}}{{> csaListTools list=relationsList}}<h2>Relații</h2>{{#each relations}}<div class="concept-relation">{{> csaObjectActions kind="relation" id=_id}}<strong>{{conceptName fromConceptId}}</strong><span>{{type}}</span><strong>{{conceptName toConceptId}}</strong><p>{{justification}}</p></div>{{else}}<p class="text-muted">Nu există relații.</p>{{/each}}</section>
  </div>
</template>
