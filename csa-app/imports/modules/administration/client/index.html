<template name="treasuryWorkspace">
  <div class="admin-room admin-room-treasury"><header><span>Camera Trezorierului</span><h1>Metale</h1><p>Bugete, cotizații și registrul mișcărilor, păstrate cu trasabilitate.</p></header>
    {{#if message}}<div class="alert alert-info">{{message}}</div>{{/if}}
    {{#if canWrite}}
      <div class="admin-room-grid">
        {{> csaObjectAdd kind="period" label="Adaugă perioadă"}}
        {{> csaObjectAdd kind="account" label="Adaugă cont"}}
        {{> csaObjectAdd kind="transaction" label="Adaugă mișcare"}}
      </div>
    {{/if}}
    <section class="admin-room-panel"><h2>Perioade</h2>{{> csaSimpleTable list=periodsList objectKind="period"}}</section><section class="admin-room-panel"><h2>Conturi</h2>{{> csaSimpleTable list=accountsList objectKind="account"}}</section><section class="admin-room-stats"><article><span>Sold înregistrat</span><strong>{{formatMoney postedBalance}}</strong></article><article><span>Încasări</span><strong>{{formatMoney totalIncome}}</strong></article><article><span>Plăți</span><strong>{{formatMoney totalExpense}}</strong></article></section>
    <section class="admin-room-panel"><h2>Registru</h2><div class="table-responsive">{{> csaListTools list=transactionsList}}<table class="table table-dark table-hover align-middle"><thead><tr>{{> csaListColumn list=transactionsList field="occurredAt" label="Data"}}{{> csaListColumn list=transactionsList field="direction" label="Tip"}}{{> csaListColumn list=transactionsList field="category" label="Categorie"}}{{> csaListColumn list=transactionsList field="description" label="Explicație"}}{{> csaListColumn list=transactionsList field="amountMinor" label="Sumă"}}{{> csaListColumn list=transactionsList field="status" label="Stare"}}<th></th></tr></thead><tbody>{{#each transactions}}<tr><td>{{formatDate occurredAt}}</td><td>{{directionLabel direction}}</td><td>{{category}}</td><td>{{description}}</td><td>{{signedMoney this}}</td><td>{{status}}</td><td>{{> csaObjectActions kind="transaction" id=_id}}{{#if canWrite}}{{#if isDraft status}}<button class="btn btn-sm btn-outline-warning js-approve-transaction" data-id="{{_id}}">Aprobă</button>{{/if}}{{#if isApproved status}}<button class="btn btn-sm btn-outline-success js-post-transaction" data-id="{{_id}}">Înregistrează</button>{{/if}}{{/if}}</td></tr>{{else}}<tr><td colspan="7" class="text-center text-muted">Nu există mișcări.</td></tr>{{/each}}</tbody></table>{{> csaListPager list=transactionsList}}</div></section>
  </div>
</template>

<template name="hospitalityWorkspace">
  <div class="admin-room admin-room-hospitality"><header><span>Camera Ospitalierului</span><h1>Ospitalier</h1><p>Evenimente, legături fraterne și sprijin discret.</p></header>{{#if message}}<div class="alert alert-info">{{message}}</div>{{/if}}
    {{#if canWrite}}<div class="admin-room-grid">{{> csaObjectAdd kind="event" label="Adaugă eveniment"}}{{> csaObjectAdd kind="case" label="Adaugă caz"}}</div>{{/if}}
    <section class="admin-room-panel"><h2>Evenimente</h2>{{> csaSimpleTable list=eventsList objectKind="event"}}</section>
    {{#if canWrite}}<section class="admin-room-panel"><h2>Cazuri restricționate</h2>{{> csaSimpleTable list=casesList objectKind="case"}}</section>{{/if}}
  </div>
</template>

<template name="visitorWorkspace">
  <div class="admin-room admin-room-secretariat"><header><span>Secretariat</span><h1>Frați vizitatori</h1><p>Invitații limitate în timp și evidența Loji de proveniență.</p></header>{{#if message}}<div class="alert alert-info">{{message}}</div>{{/if}}
    {{#if canWrite}}{{> csaObjectAdd kind="visitor" label="Adaugă vizitator"}}{{/if}}
    <section class="admin-room-panel"><div class="table-responsive">{{> csaListTools list=invitationsList}}<table class="table table-dark"><thead><tr>{{> csaListColumn list=invitationsList field="name" label="Nume"}}{{> csaListColumn list=invitationsList field="email" label="Email"}}{{> csaListColumn list=invitationsList field="originLodge" label="Loja"}}{{> csaListColumn list=invitationsList field="attestedGrade" label="Grad"}}{{> csaListColumn list=invitationsList field="status" label="Status"}}{{> csaListColumn list=invitationsList field="accessExpiresAt" label="Expiră"}}<th>Acțiuni</th></tr></thead><tbody>{{#each invitations}}<tr><td>{{name}}</td><td>{{email}}</td><td>{{originLodge}}</td><td>{{attestedGrade}}</td><td>{{status}}</td><td>{{formatDateTime accessExpiresAt}}</td><td>{{> csaObjectActions kind="visitor" id=_id}}</td></tr>{{else}}<tr><td colspan="7" class="text-muted text-center">Nu există invitații.</td></tr>{{/each}}</tbody></table>{{> csaListPager list=invitationsList}}</div></section>
  </div>
</template>
