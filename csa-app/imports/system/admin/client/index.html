<template name="globalAdmin">
  <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Administrare Globală</h1><p class="text-muted mb-0">Tenanturi și utilizatori ai platformei CSA.</p></div></div>
  {{#if message}}<div class="alert alert-info">{{message}}</div>{{/if}}
  {{#if allowed}}
    <div class="row g-4">
      <div class="col-xl-5">
        <div class="card h-100"><div class="card-header fw-semibold">Tenant nou</div><div class="card-body">
          {{> csaObjectAdd kind="tenant" label="Adaugă lojă"}}
        </div></div>
      </div>
      <div class="col-xl-7">
        <div class="card h-100"><div class="card-header fw-semibold">Utilizator nou / asociere</div><div class="card-body">
          {{> csaObjectAdd kind="globalUser" label="Adaugă utilizator / asociere"}}
        </div></div>
      </div>
      <div class="col-12"><div class="card"><div class="card-header fw-semibold">Tenanturi</div><div class="table-responsive">{{> csaListTools list=tenantsList}}<table class="table table-hover mb-0"><thead><tr>{{> csaListColumn list=tenantsList field="nume" label="Denumire"}}{{> csaListColumn list=tenantsList field="cui" label="CUI"}}{{> csaListColumn list=tenantsList field="status" label="Status"}}<th>ID</th><th></th></tr></thead><tbody>{{#each tenants}}<tr><td>{{nume}}</td><td>{{cui}}</td><td>{{status}}</td><td><code>{{_id}}</code></td><td>{{> csaObjectActions kind="tenant" id=_id}}<button class="btn btn-sm btn-outline-primary js-global-activate" data-id="{{_id}}">Activează</button></td></tr>{{/each}}</tbody></table>{{> csaListPager list=tenantsList}}</div></div></div>
      <div class="col-12"><div class="card"><div class="card-header fw-semibold">Utilizatori</div><div class="table-responsive">{{> csaListTools list=usersList}}<table class="table table-hover mb-0"><thead><tr>{{> csaListColumn list=usersList field="name" label="Nume"}}{{> csaListColumn list=usersList field="email" label="Email"}}<th>ID</th></tr></thead><tbody>{{#each users}}<tr><td>{{name}}</td><td>{{email}}</td><td><code>{{_id}}</code>{{> csaObjectActions kind="globalUser" id=_id}}</td></tr>{{/each}}</tbody></table>{{> csaListPager list=usersList}}</div></div></div>
    </div>
  {{else}}
    {{#unless loading}}<div class="alert alert-danger">Acces permis numai rolului super_admin.</div>{{/unless}}
  {{/if}}
</template>

<template name="tenantAdmin">
  <div class="mb-4"><h1 class="h2 mb-1">Administrare Tenant</h1><p class="text-muted mb-0">Date tenant, utilizatori, grupuri și drepturi pe module.</p></div>
  {{#if message}}<div class="alert alert-info">{{message}}</div>{{/if}}
  {{#if allowed}}
    {{#with activeTenant}}
      <div class="card mb-4"><div class="card-header fw-semibold">Date tenant</div><div class="card-body">{{> csaObjectActions kind="tenant" id=_id}}</div></div>
    {{/with}}
    <div class="card mb-4"><div class="card-header fw-semibold">Utilizatori tenant</div><div class="card-body">
      {{> csaObjectAdd kind="user" label="Adaugă utilizator"}}
      <div class="table-responsive">{{> csaListTools list=usersList}}<table class="table table-sm align-middle"><thead><tr>{{> csaListColumn list=usersList field="name" label="Nume"}}{{> csaListColumn list=usersList field="email" label="Email"}}<th>Status</th><th>Activare</th><th>Rol tenant</th></tr></thead><tbody>{{#each users}}<tr><td>{{name}}</td><td>{{email}}</td><td>{{statusLabel}}{{> csaObjectActions kind="user" id=_id}}</td><td><button class="btn btn-sm btn-outline-success js-user-status" data-id="{{_id}}" data-enabled="1">Activează</button> <button class="btn btn-sm btn-outline-secondary js-user-status" data-id="{{_id}}" data-enabled="0">Dezactivează</button></td><td><button class="btn btn-sm btn-outline-success js-user-admin" data-id="{{_id}}" data-enabled="1">Acordă admin</button> <button class="btn btn-sm btn-outline-danger js-user-admin" data-id="{{_id}}" data-enabled="0">Retrage</button></td></tr>{{/each}}</tbody></table>{{> csaListPager list=usersList}}</div>
    </div></div>
    <div class="card mb-4"><div class="card-header fw-semibold">Grup nou</div><div class="card-body">{{> csaObjectAdd kind="group" label="Adaugă grup"}}</div></div>
    {{#each groups}}
      <div class="card mb-4"><div class="card-header d-flex justify-content-between align-items-center"><strong>{{nume}}</strong>{{> csaObjectActions kind="group" id=_id}}<button class="btn btn-sm btn-outline-danger js-group-remove" data-id="{{_id}}">Șterge grup</button></div><div class="card-body">
<button type="button" class="btn btn-outline-primary js-group-window" data-id="{{_id}}">Editează membri și permisiuni</button>
      </div></div>
    {{/each}}
  {{else}}
    {{#unless loading}}<div class="alert alert-danger">Selectați un tenant și autentificați-vă ca tenant_admin sau super_admin.</div>{{/unless}}
  {{/if}}
</template>

<template name="groupAccessWindow"><h1>Membri și permisiuni</h1>{{#if message}}<p role="status" class="alert alert-info">{{message}}</p>{{/if}}{{#if allowed}}{{#each groups}}{{#if selectedGroup _id}}<h2>{{nume}}</h2>        <div class="row g-4"><div class="col-lg-4"><h2 class="h6">Membri</h2><form class="js-group-member-add d-flex gap-2 mb-3"><input type="hidden" name="groupId" value="{{_id}}"><select class="form-select form-select-sm" name="userId" required><option value="">Selectați utilizator</option>{{#each usersOptions}}<option value="{{_id}}">{{name}}</option>{{/each}}</select><button class="btn btn-sm btn-primary">+</button></form><ul class="list-group">{{#each members}}<li class="list-group-item d-flex justify-content-between align-items-center">{{name}}<button class="btn btn-sm btn-outline-danger js-group-member-remove" data-group="{{../_id}}" data-user="{{_id}}">−</button></li>{{/each}}</ul></div>
        <div class="col-lg-8"><h2 class="h6">Permisiuni module</h2>{{#each modules}}<form class="js-module-permissions border rounded p-2 mb-2"><input type="hidden" name="groupId" value="{{../_id}}"><input type="hidden" name="moduleId" value="{{_id}}"><div class="row align-items-center g-2"><div class="col-md-4 fw-semibold">{{nume}}</div><div class="col"><label class="form-check-label"><input class="form-check-input" type="checkbox" name="read" checked={{read}}> Read</label></div><div class="col"><label class="form-check-label"><input class="form-check-input" type="checkbox" name="write" checked={{write}}> Write</label></div><div class="col"><label class="form-check-label"><input class="form-check-input" type="checkbox" name="delete" checked={{delete}}> Delete</label></div><div class="col"><label class="form-check-label"><input class="form-check-input" type="checkbox" name="admin" checked={{admin}}> Admin</label></div><div class="col-auto"><button class="btn btn-sm btn-outline-primary" type="submit">Salvează</button></div></div></form>{{/each}}</div></div>{{/if}}{{/each}}{{/if}}</template>
