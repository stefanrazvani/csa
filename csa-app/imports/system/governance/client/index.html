<template name="governanceAdmin">
  <div class="governance-page"><header class="governance-hero"><span>Secretariat</span><h1>Registru matricol și funcții</h1><p>Apartenențe, parcurs pe grade, echipa anului masonic și jurnalul administrativ.</p></header>
    {{#if message}}<div class="alert alert-info">{{message}}</div>{{/if}}
    <nav class="governance-tabs" aria-label="Secțiuni"><button class="{{tabActive 'members'}} js-governance-tab" data-tab="members">Matricol</button><button class="{{tabActive 'offices'}} js-governance-tab" data-tab="offices">Funcții anuale</button><button class="{{tabActive 'audit'}} js-governance-tab" data-tab="audit">Audit</button></nav>
    {{#if isTab 'members'}}
      <section class="governance-panel"><h2>Actualizează apartenența</h2>{{> csaObjectAdd kind="membership" label="Adaugă apartenență"}}</section>
      <section class="governance-panel"><h2>Înregistrează grad</h2>{{> csaObjectAdd kind="degree" label="Înregistrează grad"}}</section>
      <section class="governance-panel"><h2>Membrii Loji</h2><div class="table-responsive">{{> csaListTools list=membersList}}<table class="table table-dark align-middle"><thead><tr>{{> csaListColumn list=membersList field="matriculationNo" label="Matricol"}}{{> csaListColumn list=membersList field="displayName" label="Membru"}}{{> csaListColumn list=membersList field="email" label="Email"}}{{> csaListColumn list=membersList field="currentGrade" label="Grad"}}{{> csaListColumn list=membersList field="status" label="Statut"}}<th>Intrare</th><th>Acțiuni</th></tr></thead><tbody>{{#each members}}<tr><td>{{matriculationNo}}</td><td>{{displayName}}</td><td>{{email}}</td><td><span class="governance-grade">{{gradeLabel currentGrade}}</span></td><td>{{status}}</td><td>{{formatDate joinedAt}}</td><td>{{> csaObjectActions kind="membership" id=_id}}</td></tr>{{else}}<tr><td colspan="6" class="text-center text-muted">Registrul este gol.</td></tr>{{/each}}</tbody></table>{{> csaListPager list=membersList}}</div></section>
    {{/if}}
    {{#if isTab 'offices'}}
      <section class="governance-panel"><h2>Alocă funcție</h2>{{> csaObjectAdd kind="office" label="Adaugă mandat"}}</section>
      <section class="governance-panel">{{> csaListTools list=officeTermsList}}<div class="table-responsive"><table class="table table-dark"><thead><tr>{{> csaListColumn list=officeTermsList field="userId" label="Membru"}}{{> csaListColumn list=officeTermsList field="officeCode" label="Funcție"}}{{> csaListColumn list=officeTermsList field="masonicYear" label="An"}}{{> csaListColumn list=officeTermsList field="startAt" label="Început"}}{{> csaListColumn list=officeTermsList field="endAt" label="Sfârșit"}}<th>Acțiuni</th></tr></thead><tbody>{{#each officeTerms}}<tr><td>{{userName userId}}</td><td>{{officeName officeCode}}</td><td>{{masonicYear}}</td><td>{{formatDate startAt}}</td><td>{{formatDate endAt}}</td><td>{{> csaObjectActions kind="office" id=_id}}{{#if activeOffice status}}<button class="btn btn-sm btn-outline-danger js-revoke-office" data-id="{{_id}}">Revocă</button>{{/if}}</td></tr>{{/each}}</tbody></table></div>{{> csaListPager list=officeTermsList}}</section>
    {{/if}}
    {{#if isTab 'audit'}}
      <section class="governance-panel"><h2>Evenimente recente</h2><div class="table-responsive">{{> csaListTools list=auditEventsList}}<table class="table table-dark table-sm"><thead><tr>{{> csaListColumn list=auditEventsList field="at" label="Moment"}}{{> csaListColumn list=auditEventsList field="actorId" label="Actor"}}{{> csaListColumn list=auditEventsList field="action" label="Acțiune"}}{{> csaListColumn list=auditEventsList field="entityType" label="Entitate"}}<th>Rezultat</th><th>Cross-tenant</th></tr></thead><tbody>{{#each auditEvents}}<tr><td>{{formatDateTime at}}</td><td><code>{{actorId}}</code></td><td>{{action}}</td><td>{{entityType}} {{entityId}}</td><td>{{outcome}}</td><td>{{yesNo crossTenant}}</td></tr>{{else}}<tr><td colspan="6" class="text-muted text-center">Nu există evenimente.</td></tr>{{/each}}</tbody></table>{{> csaListPager list=auditEventsList}}</div></section>
    {{/if}}
  </div>
</template>
